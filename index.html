const solid=c=>'#X^'.includes(c)||(c=='D'&&!(p&&p.key));
function spawn(){p={x:start.x,y:start.y,vx:WALK,vy:0,dir:1,cd:0,ground:false,wait:40,key:false}}
function load(i){
  an.begin(i);
  lv=i;won=false;map=LEVELS[i].map;mirrors={purple:null,green:null};order=[];used=0;stops=5;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(map[y][x]=='P')start={x:x*T+6,y:y*T+T-PH};
  spawn();ui();
}
// ---- kayıt ----
let save={stars:{},cur:0};
try{save=Object.assign(save,JSON.parse(localStorage.getItem('aynaSave')||'{}'))}catch(e){}
function store(){try{localStorage.setItem('aynaSave',JSON.stringify(save))}catch(e){}}
const unlocked=()=>{let u=0;while(save.stars[u])u++;return u};
function finish(){
  const par=LEVELS[lv].par,s=used<=par?3:used<=par+2?2:1;
  an.end('Level.completed',{stars:s});save.stars[lv]=Math.max(save.stars[lv]||0,s);save.cur=Math.min(lv+1,LEVELS.length-1);store();
}
function menu(show){
  const m=document.getElementById('menu');m.style.display=show?'block':'none';if(!show)return;
  const gr=document.getElementById('grid');gr.innerHTML='';const u=unlocked();
  LEVELS.forEach((L,i)=>{const b=document.createElement('button');const s=save.stars[i]||0;
    b.innerHTML=(i+1)+'<small>'+'★'.repeat(s)+'</small>';b.disabled=i>u;
    b.onclick=()=>{menu(false);load(i)};gr.appendChild(b)});
}
function ui(){document.getElementById('title').textContent=(lv+1)+'/'+LEVELS.length+' · '+tname(LEVELS[lv].name);document.getElementById('count').textContent=S.mir+': '+used+'/'+LEVELS[lv].par+' · ⏸ '+stops}
// ---- ayna yerleştirme (dokunarak) ----
function makeMirror(tx,ty,nx,ny){
  let b;
  const ok=(x,y)=>tile(x,y)=='#'&&!solid(tile(x+nx,y+ny));
  if(!ok(tx,ty))return null;
  if(nx){if(ok(tx,ty+1))b=[tx,ty];else if(ok(tx,ty-1))b=[tx,ty-1];else return null}
  else {if(ok(tx+1,ty))b=[tx,ty];else if(ok(tx-1,ty))b=[tx-1,ty];else return null}
  const m={tx:b[0],ty:b[1],nx,ny};
  if(nx){m.fx=nx>0?(m.tx+1)*T:m.tx*T;m.a=m.ty*T;m.b=m.a+2*T}
  else {m.fy=ny>0?(m.ty+1)*T:m.ty*T;m.a=m.tx*T;m.b=m.a+2*T}
  return m;
}
function mirrorAt(x,y){
  for(const k of ['purple','green']){const m=mirrors[k];if(!m)continue;
    const d=m.nx?Math.abs(x-m.fx)+Math.max(0,m.a-y,y-m.b):Math.abs(y-m.fy)+Math.max(0,m.a-x,x-m.b);
    if(d<22)return k}
  return null;
}
function tap(x,y){
  if(won)return;
  // karaktere dokunma: dur / devam
  if(!deadT&&x>p.x-14&&x<p.x+PW+14&&y>p.y-14&&y<p.y+PH+14){
    if(p.paused){p.paused=false;sfx.resume()}else if(stops>0){p.paused=true;stops--;ui();sfx.pause()}
    return}
  const hitK=mirrorAt(x,y);
  if(hitK){sfx.remove();mirrors[hitK]=null;order=order.filter(k=>k!=hitK);return}
  // dokunulan noktaya en yakın uygun duvar yüzeyini bul (parmak dostu)
  let best=null,bd=1e9;const cx=Math.floor(x/T),cy=Math.floor(y/T);
  for(let ty=cy-1;ty<=cy+1;ty++)for(let tx=cx-1;tx<=cx+1;tx++){
    if(tile(tx,ty)!='#')continue;
    for(const [nx,ny] of [[1,0],[-1,0],[0,1],[0,-1]]){
      if(solid(tile(tx+nx,ty+ny)))continue;
      const fx=nx?(nx>0?(tx+1)*T:tx*T):Math.min(Math.max(x,tx*T),(tx+1)*T);
      const fy=ny?(ny>0?(ty+1)*T:ty*T):Math.min(Math.max(y,ty*T),(ty+1)*T);
      const d=Math.hypot(x-fx,y-fy);
      if(d<bd&&d<40){const m=makeMirror(tx,ty,nx,ny);if(m){bd=d;best=m}}
    }
  }
  if(!best)return;
  let color=!mirrors.purple?'purple':!mirrors.green?'green':order[0];
  const o=mirrors[color=='purple'?'green':'purple'];
  if(o&&o.nx==best.nx&&o.ny==best.ny&&(best.nx?o.fx==best.fx:o.fy==best.fy)&&o.a<best.b&&best.a<o.b)return;
  sfx.place(color);mirrors[color]=best;order=order.filter(k=>k!=color);order.push(color);used++;ui();
}
// ---- ayna geçişi ----
function touching(m){
  if(m.nx){if(p.y<m.a-2||p.y+PH>m.b+2)return false;
    return m.nx<0?(p.vx>0&&p.x+PW>=m.fx-1&&p.x<m.fx):(p.vx<0&&p.x<=m.fx+1&&p.x+PW>m.fx)}
  if(p.x<m.a-2||p.x+PW>m.b+2)return false;
  return m.ny<0?(p.vy>0&&p.y+PH>=m.fy-1&&p.y<m.fy):(p.vy<0&&p.y<=m.fy+1&&p.y+PH>m.fy);
}
function portal(){
  const a0=mirrors.purple,b0=mirrors.green;if(!a0||!b0||p.cd>0)return;
  for(const [a,b] of [[a0,b0],[b0,a0]]){
    if(!touching(a))continue;
    const sp=Math.max(Math.abs(p.vx*a.nx+p.vy*a.ny),4),mid=(b.a+b.b)/2;
    if(b.nx){p.x=b.nx>0?b.fx+1:b.fx-PW-1;p.y=mid-PH/2}else{p.x=mid-PW/2;p.y=b.ny<0?b.fy-PH-1:b.fy+1}
    p.vx=b.nx*sp;p.vy=b.ny*sp;if(b.nx)p.dir=b.nx;p.cd=6;sfx.portal();return;
  }
}
function enter(){const c=p.cd;portal();return p.cd>c} // çarpınca hızı sıfırlamadan önce aynaya girmeyi dene
// ---- fizik ----
function hit(x,y){
  for(let ty=Math.floor(y/T);ty<=Math.floor((y+PH-0.01)/T);ty++)
    for(let tx=Math.floor(x/T);tx<=Math.floor((x+PW-0.01)/T);tx++)if(solid(tile(tx,ty)))return true;
  return false;
}
function near(ch){
  for(let ty=Math.floor((p.y-1)/T);ty<=Math.floor((p.y+PH+1)/T);ty++)
    for(let tx=Math.floor((p.x-1)/T);tx<=Math.floor((p.x+PW+1)/T);tx++)if(tile(tx,ty)==ch)return true;
  return false;
}
function update(){
  if(won)return;
  if(deadT>0){if(--deadT==0)spawn();return}
  if(p.wait>0){p.wait--;return}
  if(p.ground){
    if(p.paused)p.vx*=0.7;
    else if(Math.abs(p.vx)>WALK+0.1)p.vx*=0.9;else p.vx=p.dir*WALK;
  }
  p.vy=Math.min(p.vy+GRAV,MAXF);if(p.cd>0)p.cd--;
  const n=Math.ceil(Math.max(Math.abs(p.vx),Math.abs(p.vy))/6)||1;
  p.ground=false;
  for(let i=0;i<n;i++){
    portal();
    const sx=p.vx/n,sy=p.vy/n;
    if(!hit(p.x+sx,p.y))p.x+=sx;
    else{while(!hit(p.x+Math.sign(sx)*0.5,p.y))p.x+=Math.sign(sx)*0.5;if(enter())break;p.dir=-Math.sign(sx);p.vx=p.dir*Math.min(Math.abs(p.vx),WALK);break}
    portal();
    if(!hit(p.x,p.y+sy))p.y+=sy;
    else{while(!hit(p.x,p.y+Math.sign(sy)*0.5))p.y+=Math.sign(sy)*0.5;if(enter())break;if(sy>0)p.ground=true;p.vy=0}
  }
  if(Math.abs(p.vx)>0.5)p.dir=Math.sign(p.vx);
  if(near('^')||p.y>H*T){deadT=30;sfx.death();if(an.st)an.st.deaths++;return}
  if(tile(Math.floor((p.x+PW/2)/T),Math.floor((p.y+PH/2)/T))=='K'&&!p.key){p.key=true;sfx.key()}
  if(tile(Math.floor((p.x+PW/2)/T),Math.floor((p.y+PH/2)/T))=='E'){won=true;finish();sfx.win()}
}
// ---- çizim ----
function draw(){
  g.clearRect(0,0,cv.width,cv.height);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const c=map[y][x],X=x*T,Y=y*T;
    if(c=='#'){g.fillStyle='#c9ccd6';g.fillRect(X,Y,T,T);g.strokeStyle='#aab';g.strokeRect(X+.5,Y+.5,T-1,T-1)}
    else if(c=='X'){g.fillStyle='#3a3d4a';g.fillRect(X,Y,T,T)}
    else if(c=='^'){g.fillStyle='#e44';g.beginPath();for(let k=0;k<4;k++){g.moveTo(X+k*8,Y+T);g.lineTo(X+k*8+4,Y+T-14);g.lineTo(X+k*8+8,Y+T)}g.fill()}
    else if(c=='K'&&!p.key){g.fillStyle='#5cf';g.beginPath();g.arc(X+11,Y+16,6,0,7);g.fill();g.fillRect(X+15,Y+14,13,4);g.fillRect(X+23,Y+18,3,5);g.fillStyle='#1b1d24';g.beginPath();g.arc(X+11,Y+16,2.5,0,7);g.fill()}
    else if(c=='D'){if(!p.key){g.fillStyle='#8a5a2b';g.fillRect(X,Y,T,T);g.strokeStyle='#5cf';g.strokeRect(X+1.5,Y+1.5,T-3,T-3);g.fillStyle='#5cf';g.fillRect(X+14,Y+12,4,8)}else{g.strokeStyle='rgba(138,90,43,.6)';g.setLineDash([3,4]);g.strokeRect(X+1.5,Y+1.5,T-3,T-3);g.setLineDash([])}}
    else if(c=='E'){g.fillStyle='#fc3';g.fillRect(X+4,Y-T+6,T-8,2*T-6);g.fillStyle='#1b1d24';g.fillRect(X+10,Y-T+14,T-20,2*T-18)}
  }
  for(const [k,col] of [['purple',PURPLE],['green',GREEN]]){
    const m=mirrors[k];if(!m)continue;
    g.save();g.shadowColor=col;g.shadowBlur=18;g.strokeStyle=col;g.lineWidth=6;g.beginPath();
    if(m.nx){g.moveTo(m.fx+m.nx*3,m.a+2);g.lineTo(m.fx+m.nx*3,m.b-2)}else{g.moveTo(m.a+2,m.fy+m.ny*3);g.lineTo(m.b-2,m.fy+m.ny*3)}
    g.stroke();g.restore();
  }
  if(!deadT){g.fillStyle='#fff';g.fillRect(p.x,p.y,PW,PH);g.fillStyle='#222';g.fillRect(p.x+(p.dir>0?12:4),p.y+7,4,4);
    if(p.paused){g.fillStyle='#fc3';g.fillRect(p.x+4,p.y-14,4,10);g.fillRect(p.x+12,p.y-14,4,10)}}
  else{g.fillStyle='rgba(255,60,60,'+deadT/30+')';g.fillRect(p.x-4,p.y-4,PW+8,PH+8)}
  if(won){
    const par=LEVELS[lv].par,s=used<=par?3:used<=par+2?2:1;
    g.fillStyle='rgba(0,0,0,.65)';g.fillRect(0,0,cv.width,cv.height);g.textAlign='center';
    g.fillStyle='#fc3';g.font='bold 30px system-ui';g.fillText(S.win,cv.width/2,250);
    g.font='44px system-ui';g.fillText('★'.repeat(s)+'☆'.repeat(3-s),cv.width/2,310);
    g.fillStyle='#ddd';g.font='18px system-ui';g.fillText(S.used(used),cv.width/2,350);
    g.fillText(lv<LEVELS.length-1?S.next:S.done,cv.width/2,400);
  }
}
function loop(){update();draw();requestAnimationFrame(loop)}
addEventListener('pointerdown',()=>{audioOn();if(actx&&actx.state=='suspended')actx.resume()},true);
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();
  if(won){load((lv+1)%LEVELS.length);return}
  const r=cv.getBoundingClientRect();tap((e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height);
});
cv.addEventListener('contextmenu',e=>e.preventDefault());
document.getElementById('rs').onclick=()=>load(lv);
addEventListener('keydown',e=>{if(e.key.toLowerCase()=='r')load(lv)});
const sb=document.getElementById('snd');sb.textContent=muted?'🔇':'🔊';
sb.onclick=()=>{muted=!muted;sb.textContent=muted?'🔇':'🔊';try{localStorage.setItem('aynaMute',muted?'1':'0')}catch(e){}};
document.getElementById('mn').onclick=()=>menu(true);
document.getElementById('menu').onclick=e=>{if(e.target.id=='menu')menu(false)};
load(Math.min(save.cur||0,LEVELS.length-1));loop();
</script>

<script type="module">
// Math.random is not cryptographically secure, but it's good enough for our purposes
function randomString() {
  return (0 | (Math.random() * 9e6)).toString(36);
}

/**
 * Calculate the SHA-256 hash of a string using a provided instance of SubtleCrypto
 * (e.g. window.crypto.subtle).
 *
 * Requires `.digest()` to be available on the SubtleCrypto instance.
 *
 * Defaults to globalThis.crypto.subtle if available.
 *
 * // https://stackoverflow.com/a/48161723/54547
 *
 * @param {Function} subtleCrypto
 * @param {string} message
 * @returns {Promise<string>}
 */
async function sha256(message, subtleCrypto = globalThis?.crypto?.subtle) {
  // encode as UTF-8
  const messageBuffer = new TextEncoder().encode(message);

  // hash the message
  const hashBuffer = await subtleCrypto.digest('SHA-256', messageBuffer);

  // convert ArrayBuffer to Array
  const hashArray = [...new Uint8Array(hashBuffer)];

  // convert bytes to hex string
  const hashHex = hashArray.map((b) => b.toString(16).padStart(2, '0')).join('');

  return hashHex;
}

class Store {
  #data = [];

  async push(value) {
    value = await value;
    this.#data.push(value);
  }

  clear() {
    this.#data = [];
  }

  values() {
    return this.#data;
  }
}

// @rollup/plugin-replace replaces this with the version number from `package.json`
const version = '2.0.4';

/**
 * @typedef {Object} TelemetryDeckOptions
 *
 * @property {string} appID the app ID to send telemetry data to
 * @property {string} clientUser the clientUser ID to send telemetry data to
 * @property {string} [target] the target URL to send telemetry data to
 * @property {string} [sessionID] An optional session ID to include in each signal
 * @property {string} [salt] A salt to use when hashing the clientUser ID
 * @property {boolean} [testMode] If "true", signals will be marked as test signals and only show up in Test Mode in the Dashbaord
 * @property {Store} [store] A store to use for queueing signals
 * @property {Function} [subtleCrypto] Used for providing an alternative implementation of SubtleCrypto where no browser is available. Expects a class providing a `.digest(method, value)` method.
 */

/**
 * @typedef {Object.<string, any>} TelemetryDeckPayload
 */

class TelemetryDeck {
  appID = '';
  clientUser = '';
  salt = '';
  target = 'https://nom.telemetrydeck.com/v2/';
  testMode = false;

  /**
   *
   * @param {TelemetryDeckOptions} options
   */
  constructor(options = {}) {
    const { target, appID, clientUser, sessionID, salt, testMode, store, subtleCrypto } = options;

    if (!appID) {
      throw new Error('appID is required');
    }

    this.store = store ?? new Store();
    this.target = target ?? this.target;
    this.appID = appID;
    this.clientUser = clientUser;
    this.sessionID = sessionID ?? randomString();
    this.salt = salt ?? this.salt;
    this.testMode = testMode ?? this.testMode;
    this.subtleCrypto = subtleCrypto;
  }

  /**
   * Send a TelemetryDeck signal
   *
   * @param {string} type the type of telemetry data to send
   * @param {TelemetryDeckPayload} [payload] custom payload to be stored with each signal
   * @param {TelemetryDeckOptions} [options]
   * @returns <Promise<Response>> a promise with the response from the server, echoing the sent data
   */
  async signal(type, payload, options) {
    const body = await this._build(type, payload, options);

    return this._post([body]);
  }

  /**
   * Enqueue a signal to be sent to TelemetryDeck later.
   *
   * Use flush() to send all queued signals.
   *
   * @param {string} type
   * @param {TelemetryDeckPayload} [payload]
   * @param {TelemetryDeckOptions} [options]
   * @returns <Promise>
   */
  async queue(type, payload, options) {
    const receivedAt = new Date().toISOString();
    const bodyPromise = this._build(type, payload, options, receivedAt);

    return this.store.push(bodyPromise);
  }

  /**
   * Send all queued signals to TelemetryDeck.
   *
   * Enqueue signals with queue().
   *
   * @returns <Promise<Response>> a promise with the response from the server, echoing the sent data
   */
  async flush() {
    const flushPromise = this._post(this.store.values());

    this.store.clear();

    return flushPromise;
  }

  _clientUserAndSalt = '';
  _clientUserHashed = '';

  async _hashedClientUser(clientUser, salt) {
    if (clientUser + salt !== this._clientUserAndSalt) {
      this._clientUserHashed = await sha256([clientUser, salt].join(''), this.subtleCrypto);
      this._clientUserAndSalt = clientUser + salt;
    }

    return this._clientUserHashed;
  }

  async _build(type, payload, options, receivedAt) {
    const { appID, testMode } = this;
    let { clientUser, salt, sessionID } = this;

    options = options ?? {};
    clientUser = options.clientUser ?? clientUser;
    salt = options.salt ?? salt;
    sessionID = options.sessionID ?? sessionID;

    if (!type) {
      throw new Error(`TelemetryDeck: "type" is not set`);
    }

    if (!appID) {
      throw new Error(`TelemetryDeck: "appID" is not set`);
    }

    if (!clientUser) {
      throw new Error(`TelemetryDeck: "clientUser" is not set`);
    }

    clientUser = await this._hashedClientUser(clientUser, salt);

    const body = {
      clientUser,
      sessionID,
      appID,
      type,
      telemetryClientVersion: `JavaScriptSDK ${version}`,
    };

    if (receivedAt) {
      body.receivedAt = receivedAt;
    }

    if (testMode) {
      body.isTestMode = true;
    }

    return this._appendPayload(body, payload);
  }

  _appendPayload(body, payload) {
    if (!payload || typeof payload !== 'object' || Object.keys(payload).length === 0) {
      return body;
    }

    body.payload = {};

    for (const [key, value] of Object.entries(payload ?? {})) {
      if (key === 'floatValue') {
        body.payload[key] = Number.parseFloat(value);
      } else if (value instanceof Date) {
        body.payload[key] = value.toISOString();
      } else if (typeof value === 'string') {
        body.payload[key] = value;
      } else if (typeof value === 'object') {
        body.payload[key] = JSON.stringify(value);
      } else {
        body.payload[key] = `${value}`;
      }
    }

    return body;
  }

  _post(body) {
    const { target } = this;

    return fetch(target, {
      method: 'POST',
      mode: 'cors',
      headers: {
        'Content-Type': 'application/json',
      },
      body: JSON.stringify(body),
    });
  }
}
